
name: wp-dev

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    image: wp-dev:local
    container_name: wp-api-dev
    restart: unless-stopped
    init: true

    working_dir: /workspace

    command: >
      sh -c "pnpm --filter api exec prisma generate &&
             pnpm --filter api dev"

    env_file:
      - ./apps/api/.env.docker

    environment:
      NODE_ENV: development
      PORT: "5001"
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "5001:5001"

    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - shared_node_modules:/workspace/packages/shared/node_modules
      - ./storage:/workspace/apps/api/storage

    networks:
      - wp-network
      - mysql_database_network

  web:
    image: wp-dev:local
    container_name: wp-web-dev
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true

    working_dir: /workspace/apps/web

    command:
      - pnpm
      - exec
      - next
      - dev
      - --hostname
      - "0.0.0.0"
      - --port
      - "3001"

    environment:
      NODE_ENV: development
      PORT: "3001"
      HOSTNAME: "0.0.0.0"

      NEXT_PUBLIC_BACKEND_LAN_URL: http://192.168.1.137:5001
      NEXT_PUBLIC_API_URL: http://192.168.1.137:5001/api
      NEXT_PUBLIC_SOCKET_URL: http://192.168.1.137:5001

      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "3001:3001"

    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - shared_node_modules:/workspace/packages/shared/node_modules
      - next_cache:/workspace/apps/web/.next

    depends_on:
      - api

    networks:
      - wp-network

volumes:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
  next_cache:

networks:
  wp-network:
    driver: bridge

  mysql_database_network:
    external: true
    name: mysql_database_network



















